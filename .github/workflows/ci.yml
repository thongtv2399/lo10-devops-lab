name: LO10 CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lo10-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: Test and Package

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Grant Maven Wrapper permission
        run: chmod +x mvnw

      - name: Run unit tests
        run: ./mvnw --batch-mode clean test

      - name: Package application
        run: ./mvnw --batch-mode package -DskipTests

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: lo10-devops-lab-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lo10-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  docker-build:
    name: Build Docker Image

    runs-on: ubuntu-latest
    needs:
      - test-and-package

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            --tag lo10-devops-lab:${{ github.sha }} \
            .

      - name: Inspect Docker image
        run: docker image inspect lo10-devops-lab:${{ github.sha }}